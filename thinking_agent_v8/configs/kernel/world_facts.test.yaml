# Kernel World Facts — test policy (deterministic, small budgets)
version: "test-1"
environment: "test"

budgets:
  iterations: 12
  cognitive_calls: 24
  tokens: 40000
  agents_per_round: 6
  deadline_seconds: 1800
  evoc_base: 10.0
  evoc_decay: 0.5
  novelty_plateau: 3
  gate_reentry_budget: 2
  reframe_budget: 2
  pending_timeout_seconds: 3600

gates:
  reentry_budget: 2
  reframe_budget: 2

verification:
  class_bars:
    A1: 0.60
    A2: 0.65
    A3: 0.70
    A4: 0.80
    A5: 0.85
  verifier_identities:
    - identity_id: verifier-alpha
      model_id: mock-verifier
      lineage: primary
      accepted: true
    - identity_id: verifier-beta
      model_id: mock-verifier
      lineage: independent-second
      accepted: true
  verifier_outage: false
  unknown_class_defaults_to: "A5"
  trust_margin: 0.1

memory:
  trust_margin: 0.1
  consolidation_threshold: 3
  procedural_write_authorized: false

improvement:
  baseline_frozen: true

sdl:
  enabled: false
  pool_min: 20
  quick_review_trials: 10
  deep_review_schedule: "monthly"
  counter_design_canary_enabled: false
  discovery_budget_candidates: 50

action_taxonomy:
  calculator: A1
  knowledge_lookup: A1
  http_retrieval: A2
  database_query: A1
  external_api_write: A3
  send_email: A4
  payment: A5
  deploy_service: A4
  delete_resource: A4
  replicate: A5

pending_allowlist:
  - t_readonly_fetch
