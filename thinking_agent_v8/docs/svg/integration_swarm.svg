<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
    <marker id="arrowX" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d93025"/>
    </marker>
  </defs>
  <rect width="860" height="380" fill="#ffffff"/>

  <rect x="30" y="30" width="230" height="150" rx="8" fill="#f3e8fd" stroke="#9334e6"/>
  <text x="145" y="54" font-size="13.5" font-weight="bold" fill="#7627bb" text-anchor="middle">SWARM LAYER</text>
  <text x="145" y="74" font-size="11" fill="#7627bb" text-anchor="middle">task envelope · correlation id</text>
  <text x="145" y="90" font-size="11" fill="#7627bb" text-anchor="middle">allowed permissions · deadline</text>
  <text x="145" y="106" font-size="11" fill="#7627bb" text-anchor="middle">parent audit reference</text>
  <text x="145" y="128" font-size="11" fill="#7627bb" text-anchor="middle">(out of scope for this repo —</text>
  <text x="145" y="144" font-size="11" fill="#7627bb" text-anchor="middle">impl §2.2)</text>

  <rect x="340" y="30" width="240" height="150" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="460" y="54" font-size="13.5" font-weight="bold" fill="#174ea6" text-anchor="middle">THINKING AGENT WORKER</text>
  <text x="460" y="74" font-size="11" fill="#174ea6" text-anchor="middle">one governed task</text>
  <text x="460" y="92" font-size="11" fill="#174ea6" text-anchor="middle">META→WHAT→WHY→HOW→DO→REVIEW</text>
  <text x="460" y="110" font-size="11" fill="#174ea6" text-anchor="middle">kernel · verification · packet</text>
  <text x="460" y="134" font-size="11" fill="#174ea6" text-anchor="middle">output: one TaskResult — status,</text>
  <text x="460" y="150" font-size="11" fill="#174ea6" text-anchor="middle">packet, escalation info</text>

  <rect x="660" y="30" width="170" height="150" rx="8" fill="#e6f4ea" stroke="#188038"/>
  <text x="745" y="54" font-size="12.5" font-weight="bold" fill="#137333" text-anchor="middle">PROVIDERS</text>
  <text x="745" y="74" font-size="11" fill="#137333" text-anchor="middle">DeepSeek · xAI · local</text>
  <text x="745" y="92" font-size="11" fill="#137333" text-anchor="middle">OpenAI-compatible</text>
  <text x="745" y="110" font-size="11" fill="#137333" text-anchor="middle">one ModelAdapter</text>
  <text x="745" y="128" font-size="11" fill="#137333" text-anchor="middle">interface (§20.1)</text>
  <text x="745" y="150" font-size="11" fill="#137333" text-anchor="middle">judge = separate identity</text>

  <g stroke="#5f6368" stroke-width="1.3" marker-end="url(#arrow)">
    <line x1="260" y1="105" x2="337" y2="105"/>
    <line x1="580" y1="105" x2="657" y2="105"/>
  </g>
  <text x="298" y="98" font-size="11" fill="#5f6368" text-anchor="middle">request</text>
  <text x="618" y="98" font-size="11" fill="#5f6368" text-anchor="middle">model calls</text>
  <path d="M 340 160 C 300 220, 260 200, 260 183" stroke="#5f6368" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
  <text x="295" y="230" font-size="11" fill="#5f6368" text-anchor="middle">TaskResult</text>

  <!-- cannot list -->
  <rect x="180" y="250" width="500" height="106" rx="8" fill="#fce8e6" stroke="#d93025"/>
  <text x="430" y="272" font-size="12.5" font-weight="bold" fill="#a50e0e" text-anchor="middle">THE SWARM LAYER CANNOT…</text>
  <g font-size="11" fill="#a50e0e">
    <text x="200" y="294">override World Facts</text>
    <text x="200" y="312">bypass approval</text>
    <text x="200" y="330">supply fake verifier identities</text>
    <text x="470" y="294">write memory / KB / ledger directly</text>
    <text x="470" y="312">convert UNSAFE into execution</text>
    <text x="470" y="330">— all enforced server-side by the kernel</text>
  </g>
</svg>
