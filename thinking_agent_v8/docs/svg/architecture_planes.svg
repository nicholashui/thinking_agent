<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" font-family="Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
  </defs>
  <rect width="860" height="500" fill="#ffffff"/>

  <rect x="230" y="8" width="400" height="44" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="430" y="26" font-size="14" fill="#174ea6" text-anchor="middle" font-weight="bold">PUBLIC API — invoke · ainvoke · stream · resume · get_state · get_packet</text>
  <text x="430" y="43" font-size="11.5" fill="#174ea6" text-anchor="middle">SDL admin: discover · propose · approve · execute_next_trial · review</text>

  <rect x="170" y="76" width="520" height="120" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="430" y="96" font-size="14" fill="#174ea6" text-anchor="middle" font-weight="bold">TASK ORCHESTRATION GRAPH</text>
  <g font-size="11.5" fill="#174ea6" text-anchor="middle">
    <text x="430" y="116">META → WHAT → WHY → HOW → DO → REVIEW</text>
    <text x="430" y="133">state-only classifier · proof-carrying packet · checkpoint</text>
    <text x="430" y="150">governed loop: budgets · EVOC/plateau · gates · reframe · deadline</text>
    <text x="430" y="167">style dispatch + contracts · premortem · red team · council</text>
    <text x="430" y="184">verification caches · second-verifier rule · L3 attestation</text>
  </g>

  <line x1="430" y1="52" x2="430" y2="73" stroke="#5f6368" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- planes row -->
  <g stroke-width="1.4">
    <rect x="30"  y="230" width="190" height="110" rx="8" fill="#fce8e6" stroke="#d93025"/>
    <rect x="240" y="230" width="190" height="110" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
    <rect x="450" y="230" width="190" height="110" rx="8" fill="#f3e8fd" stroke="#9334e6"/>
    <rect x="660" y="230" width="170" height="110" rx="8" fill="#e6f4ea" stroke="#188038"/>
  </g>
  <g font-size="11.5">
    <text x="125" y="250" text-anchor="middle" font-weight="bold" fill="#a50e0e">GOVERNANCE KERNEL</text>
    <text x="125" y="268" text-anchor="middle" fill="#a50e0e">WorldFactsSnapshot</text>
    <text x="125" y="283" text-anchor="middle" fill="#a50e0e">frozen · facade-only</text>
    <text x="125" y="298" text-anchor="middle" fill="#a50e0e">attestation · bars</text>
    <text x="125" y="313" text-anchor="middle" fill="#a50e0e">allowlist · tokens</text>
    <text x="125" y="328" text-anchor="middle" fill="#a50e0e">REPLICATE denied</text>

    <text x="335" y="250" text-anchor="middle" font-weight="bold" fill="#174ea6">COGNITIVE SERVICES</text>
    <text x="335" y="268" text-anchor="middle" fill="#174ea6">frame · diagnosis</text>
    <text x="335" y="283" text-anchor="middle" fill="#174ea6">generation · styles</text>
    <text x="335" y="298" text-anchor="middle" fill="#174ea6">council · premortem</text>
    <text x="335" y="313" text-anchor="middle" fill="#174ea6">red team · insight</text>
    <text x="335" y="328" text-anchor="middle" fill="#174ea6">structure scan</text>

    <text x="545" y="250" text-anchor="middle" font-weight="bold" fill="#7627bb">TOOL PLANE</text>
    <text x="545" y="268" text-anchor="middle" fill="#7627bb">allowlist · ranks</text>
    <text x="545" y="283" text-anchor="middle" fill="#7627bb">idempotency keys</text>
    <text x="545" y="298" text-anchor="middle" fill="#7627bb">domain allowlists</text>
    <text x="545" y="313" text-anchor="middle" fill="#7627bb">receipts · sanitize</text>
    <text x="545" y="328" text-anchor="middle" fill="#7627bb">compensation</text>

    <text x="745" y="250" text-anchor="middle" font-weight="bold" fill="#137333">EVALUATION</text>
    <text x="745" y="268" text-anchor="middle" fill="#137333">candidate / outcome</text>
    <text x="745" y="283" text-anchor="middle" fill="#137333">verifiers</text>
    <text x="745" y="298" text-anchor="middle" fill="#137333">external judge</text>
    <text x="745" y="313" text-anchor="middle" fill="#137333">second judge</text>
    <text x="745" y="328" text-anchor="middle" fill="#137333">frozen baseline</text>
  </g>

  <!-- memory band -->
  <rect x="130" y="372" width="600" height="66" rx="8" fill="#fef7e0" stroke="#f9ab00"/>
  <text x="430" y="394" font-size="13" font-weight="bold" fill="#b06000" text-anchor="middle">MEMORY &amp; LEARNING PLANE</text>
  <text x="430" y="413" font-size="11.5" fill="#b06000" text-anchor="middle">memory (contradiction · procedural quarantine) · routing KB · improvement proposals</text>
  <text x="430" y="429" font-size="11.5" fill="#b06000" text-anchor="middle">SDL — discovery (read-only) · gap map (verdict-only) · plans (gated) · ledger (append-only) · review</text>

  <line x1="430" y1="196" x2="430" y2="227" stroke="#5f6368" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="430" y1="340" x2="430" y2="369" stroke="#5f6368" stroke-width="1.3" marker-end="url(#arrow)"/>

  <text x="430" y="462" font-size="12" fill="#5f6368" text-anchor="middle">authority separation — the model may propose · the kernel may authorize · the judge may score · the ledger may record</text>
  <text x="430" y="480" font-size="12" fill="#5f6368" text-anchor="middle">no single component performs all roles (impl §31)</text>
</svg>
