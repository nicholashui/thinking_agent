<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d93025"/>
    </marker>
  </defs>
  <rect width="860" height="380" fill="#ffffff"/>

  <text x="430" y="24" font-size="13.5" font-weight="bold" fill="#202124" text-anchor="middle">The Self-Directed Learning cycle — discover → plan → gate → trial → judge → ledger → review</text>

  <!-- cycle -->
  <g text-anchor="middle" font-size="12">
    <rect x="30"  y="60" width="150" height="90" rx="8" fill="#e6f4ea" stroke="#188038"/>
    <text x="105" y="82" font-weight="bold" fill="#137333">1. DISCOVER</text>
    <text x="105" y="100" fill="#137333">arXiv / curated</text>
    <text x="105" y="116" fill="#137333">READ-ONLY</text>
    <text x="105" y="132" fill="#137333">provenance + novelty</text>

    <rect x="210" y="60" width="150" height="90" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
    <text x="285" y="82" font-weight="bold" fill="#174ea6">2. GAP MAP</text>
    <text x="285" y="100" fill="#174ea6">verdict-derived</text>
    <text x="285" y="116" fill="#174ea6">weakness inventory</text>
    <text x="285" y="132" fill="#174ea6">design records inert</text>

    <rect x="390" y="60" width="150" height="90" rx="8" fill="#fef7e0" stroke="#f9ab00"/>
    <text x="465" y="82" font-weight="bold" fill="#b06000">3. PLAN (DRAFT)</text>
    <text x="465" y="100" fill="#b06000">gap × uncertainty ×</text>
    <text x="465" y="116" fill="#b06000">novelty − cost</text>
    <text x="465" y="132" fill="#b06000">max 2 attempts</text>

    <rect x="570" y="60" width="120" height="90" rx="8" fill="#fce8e6" stroke="#d93025"/>
    <text x="630" y="82" font-weight="bold" fill="#a50e0e">4. GATE</text>
    <text x="630" y="100" fill="#a50e0e">human</text>
    <text x="630" y="116" fill="#a50e0e">approval</text>
    <text x="630" y="132" fill="#a50e0e">invariant 14</text>

    <rect x="720" y="60" width="120" height="90" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
    <text x="780" y="82" font-weight="bold" fill="#174ea6">5. TRIAL</text>
    <text x="780" y="100" fill="#174ea6">sandboxed</text>
    <text x="780" y="116" fill="#174ea6">advisory</text>
    <text x="780" y="132" fill="#174ea6">governed</text>
  </g>

  <g stroke="#5f6368" stroke-width="1.3" marker-end="url(#arrow)">
    <line x1="180" y1="105" x2="207" y2="105"/>
    <line x1="360" y1="105" x2="387" y2="105"/>
    <line x1="540" y1="105" x2="567" y2="105"/>
    <line x1="690" y1="105" x2="717" y2="105"/>
  </g>

  <!-- lower row -->
  <g text-anchor="middle" font-size="12">
    <rect x="180" y="200" width="230" height="90" rx="8" fill="#e6f4ea" stroke="#188038"/>
    <text x="295" y="222" font-weight="bold" fill="#137333">6. JUDGE (external)</text>
    <text x="295" y="240" fill="#137333">eight dimensions · J1 second judge</text>
    <text x="295" y="256" fill="#137333">agent NEVER judges its own trials</text>
    <text x="295" y="272" fill="#137333">judge failure → zero writes</text>

    <rect x="440" y="200" width="230" height="90" rx="8" fill="#fce8e6" stroke="#d93025"/>
    <text x="555" y="222" font-weight="bold" fill="#a50e0e">7. LEDGER</text>
    <text x="555" y="240" fill="#a50e0e">append-only · hash-chained</text>
    <text x="555" y="256" fill="#a50e0e">judge pipeline writes only</text>
    <text x="555" y="272" fill="#a50e0e">corrections = new entries</text>

    <rect x="700" y="200" width="130" height="90" rx="8" fill="#fef7e0" stroke="#f9ab00"/>
    <text x="765" y="222" font-weight="bold" fill="#b06000">8. REVIEW</text>
    <text x="765" y="240" fill="#b06000">quick / deep</text>
    <text x="765" y="256" fill="#b06000">proposals only</text>
    <text x="765" y="272" fill="#b06000">rule 48</text>
  </g>

  <path d="M 780 150 C 780 172, 765 172, 765 197" stroke="#5f6368" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
  <g stroke="#5f6368" stroke-width="1.3" marker-end="url(#arrow)">
    <line x1="410" y1="245" x2="437" y2="245"/>
    <line x1="670" y1="245" x2="697" y2="245"/>
  </g>
  <path d="M 295 290 C 295 320, 105 320, 105 154" stroke="#5f6368" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
  <text x="190" y="322" font-size="10.5" fill="#5f6368" text-anchor="middle">ledger + gap map feed the NEXT discovery round (P6: the loop closes)</text>
</svg>
