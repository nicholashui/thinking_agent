<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" font-family="Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
  </defs>
  <rect width="860" height="280" fill="#ffffff"/>

  <g text-anchor="middle" font-size="12.5">
    <rect x="40"  y="60" width="150" height="100" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
    <text x="115" y="84" font-weight="bold" fill="#174ea6">REQUIREMENTS</text>
    <text x="115" y="104" fill="#174ea6">Python ≥ 3.12</text>
    <text x="115" y="122" fill="#174ea6">pip / uv</text>
    <text x="115" y="140" fill="#174ea6">SQLite (bundled)</text>
    <text x="115" y="156" fill="#174ea6">NO Docker</text>

    <rect x="230" y="60" width="150" height="100" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
    <text x="305" y="84" font-weight="bold" fill="#174ea6">VENV</text>
    <text x="305" y="104" fill="#174ea6">python3.12 -m venv</text>
    <text x="305" y="122" fill="#174ea6">Windows:</text>
    <text x="305" y="138" fill="#174ea6">.venv\Scripts\activate</text>
    <text x="305" y="154" fill="#174ea6">Unix: source</text>

    <rect x="420" y="60" width="150" height="100" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
    <text x="495" y="84" font-weight="bold" fill="#174ea6">INSTALL</text>
    <text x="495" y="104" fill="#174ea6">pip install -e</text>
    <text x="495" y="120" fill="#174ea6">".[dev,sqlite]"</text>
    <text x="495" y="140" fill="#174ea6">lock file before</text>
    <text x="495" y="156" fill="#174ea6">release (impl §4.3)</text>

    <rect x="610" y="60" width="170" height="100" rx="8" fill="#e6f4ea" stroke="#188038"/>
    <text x="695" y="84" font-weight="bold" fill="#137333">VERIFY</text>
    <text x="695" y="104" fill="#137333">pytest tests/ -q</text>
    <text x="695" y="122" fill="#137333">ruff check src/</text>
    <text x="695" y="140" fill="#137333">CLI smoke run</text>
    <text x="695" y="156" fill="#137333">→ eight states</text>
  </g>

  <g stroke="#5f6368" stroke-width="1.4" marker-end="url(#arrow)">
    <line x1="190" y1="110" x2="227" y2="110"/>
    <line x1="380" y1="110" x2="417" y2="110"/>
    <line x1="570" y1="110" x2="607" y2="110"/>
  </g>

  <rect x="120" y="190" width="620" height="62" rx="8" fill="#fef7e0" stroke="#f9ab00"/>
  <text x="430" y="212" font-size="12.5" font-weight="bold" fill="#b06000" text-anchor="middle">PROVIDER EXTRAS ARE OPTIONAL — CORE NEVER IMPORTS PROVIDER PACKAGES</text>
  <text x="430" y="232" font-size="11.5" fill="#b06000" text-anchor="middle">OpenAI-compatible adapter covers DeepSeek / xAI / local — keys from environment, never the repository</text>
</svg>
