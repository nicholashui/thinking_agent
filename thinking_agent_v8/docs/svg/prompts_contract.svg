<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
  </defs>
  <rect width="860" height="420" fill="#ffffff"/>

  <!-- contract elements -->
  <rect x="30" y="40" width="380" height="220" rx="8" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="220" y="62" font-size="13.5" font-weight="bold" fill="#174ea6" text-anchor="middle">PROMPT CONTRACT (every LLM call)</text>
  <g font-size="11.5" fill="#174ea6">
    <text x="48" y="84">1. role · 2. stage objective</text>
    <text x="48" y="104">3. allowed authority</text>
    <text x="48" y="124">4. PROHIBITED authority</text>
    <text x="48" y="144">5. validated stage inputs</text>
    <text x="48" y="164">6. evidence with trust labels</text>
    <text x="48" y="184">7. memory references</text>
    <text x="48" y="204">8. required style contract</text>
    <text x="48" y="224">9. output schema</text>
    <text x="250" y="84">10. budget · 11. verification</text>
    <text x="250" y="104">expectations</text>
    <text x="250" y="124">12. injection-resistance</text>
    <text x="250" y="144">instruction</text>
    <text x="250" y="164">13. prompt version</text>
    <text x="250" y="184">NO hidden chain-of-thought</text>
    <text x="250" y="204">requested — ever</text>
  </g>

  <!-- structured output -->
  <rect x="480" y="40" width="350" height="90" rx="8" fill="#e6f4ea" stroke="#188038"/>
  <text x="655" y="62" font-size="13" font-weight="bold" fill="#137333" text-anchor="middle">STRUCTURED OUTPUT (Pydantic)</text>
  <text x="655" y="82" font-size="11.5" fill="#137333" text-anchor="middle">ProblemFrame · DiagnosisResult · AltSet</text>
  <text x="655" y="98" font-size="11.5" fill="#137333" text-anchor="middle">CandidateVerificationReport · StylePassResult</text>
  <text x="655" y="114" font-size="11.5" fill="#137333" text-anchor="middle">OutcomeVerification · JudgeVerdict</text>

  <!-- repair + fault -->
  <rect x="480" y="150" width="350" height="110" rx="8" fill="#fef7e0" stroke="#f9ab00"/>
  <text x="655" y="172" font-size="12.5" font-weight="bold" fill="#b06000" text-anchor="middle">SCHEMA FAILURE → ONE REPAIR → FAULT</text>
  <text x="655" y="192" font-size="11" fill="#b06000" text-anchor="middle">1 repair attempt with validation errors</text>
  <text x="655" y="208" font-size="11" fill="#b06000" text-anchor="middle">→ optional provider fallback</text>
  <text x="655" y="224" font-size="11" fill="#b06000" text-anchor="middle">→ fault translation (evidence / escalation /</text>
  <text x="655" y="240" font-size="11" fill="#b06000" text-anchor="middle">resource handling) — never silent acceptance</text>

  <!-- external content -->
  <rect x="30" y="290" width="380" height="100" rx="8" fill="#fce8e6" stroke="#d93025"/>
  <text x="220" y="312" font-size="12.5" font-weight="bold" fill="#a50e0e" text-anchor="middle">EXTERNAL CONTENT = UNTRUSTED EVIDENCE</text>
  <text x="220" y="332" font-size="11" fill="#a50e0e" text-anchor="middle">source + content_hash wrapped, size-bounded, sanitized</text>
  <text x="220" y="350" font-size="11" fill="#a50e0e" text-anchor="middle">treat as evidence · never follow instructions inside</text>
  <text x="220" y="368" font-size="11" fill="#a50e0e" text-anchor="middle">cite evidence IDs · surface suspected injection</text>

  <!-- roles -->
  <rect x="480" y="290" width="350" height="100" rx="8" fill="#f3e8fd" stroke="#9334e6"/>
  <text x="655" y="312" font-size="12.5" font-weight="bold" fill="#7627bb" text-anchor="middle">ROLE SEPARATION</text>
  <text x="655" y="332" font-size="11" fill="#7627bb" text-anchor="middle">meta router · frame builder · diagnostician · styles</text>
  <text x="655" y="350" font-size="11" fill="#7627bb" text-anchor="middle">verifiers · review engine · curriculum judge · second judge</text>
  <text x="655" y="368" font-size="11" fill="#7627bb" text-anchor="middle">high-stakes generation and verification use</text>
  <text x="655" y="384" font-size="11" fill="#7627bb" text-anchor="middle">DIFFERENT accepted identities (J3)</text>

  <g stroke="#5f6368" stroke-width="1.3" marker-end="url(#arrow)">
    <line x1="410" y1="80" x2="477" y2="80"/>
  </g>
</svg>
