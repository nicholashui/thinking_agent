  <text x="430" y="198" font-size="13" font-weight="bold" fill="#3c4043" text-anchor="middle">SCHEDULED OPERATIONS (systemd timer · launchd · Task Scheduler)</text>
  <g font-size="11.5" fill="#3c4043" text-anchor="middle">
    <rect x="50" y="214" width="180" height="74" rx="6" fill="#ffffff" stroke="#5f6368"/>
    <text x="140" y="235" font-weight="bold">EVERY 5 MIN</text>
    <text x="140" y="253">pending-approval</text>
    <text x="140" y="269">timeout checks</text>
