<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
  </defs>
  <rect width="860" height="420" fill="#ffffff"/>

  <text x="430" y="26" font-size="14" font-weight="bold" fill="#202124" text-anchor="middle">Native service processes (production — impl §29.3) · no Docker</text>

  <!-- services -->
  <g text-anchor="middle" font-size="12">
