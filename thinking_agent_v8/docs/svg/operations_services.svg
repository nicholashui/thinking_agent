    <text x="275" y="109" fill="#a50e0e">signed versions</text>
    <text x="275" y="125" fill="#a50e0e">least privilege</text>

    <rect x="370" y="50" width="150" height="96" rx="8" fill="#f3e8fd" stroke="#9334e6"/>
