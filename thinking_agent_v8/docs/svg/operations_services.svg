    <text x="615" y="93" fill="#137333">judge worker</text>
    <text x="615" y="109" fill="#137333">verdicts only</text>
    <text x="615" y="125" fill="#137333">calibration</text>

    <rect x="710" y="50" width="130" height="96" rx="8" fill="#fef7e0" stroke="#f9ab00"/>
    <text x="775" y="74" font-weight="bold" fill="#b06000">SDL</text>
    <text x="775" y="93" fill="#b06000">scheduler</text>
    <text x="775" y="109" fill="#b06000">discovery</text>
    <text x="775" y="125" fill="#b06000">review</text>
